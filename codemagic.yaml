workflows:
  ios-release:
    name: iOS Release (FlutterFlow)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nome da integração App Store Connect em Codemagic › Team settings › Integrations.
      app_store_connect: Codemagic Studio59
    environment:
      flutter: 3.41.4
      xcode: 26.0.1
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pt.studio59.app
    scripts:
      - name: Flutter Pub Get
        script: flutter pub get
      - name: Assinatura
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          BUILD_COUNTER="${CM_BUILD_NUMBER:-0}"
          BUILD_SUFFIX=$(printf '%04d' $((BUILD_COUNTER % 10000)))
          BUILD_NUMBER_OVERRIDE="$(date +%Y%m%d)${BUILD_SUFFIX}"
          echo "Using build number: $BUILD_NUMBER_OVERRIDE"
          flutter build ipa --release --build-name=1.1.0 --build-number=$BUILD_NUMBER_OVERRIDE \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
